<div [formGroupName]="controlKey">
    <div class="row">
        <div class="col-lg-6">
            <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-16" for="title">
                Title
            </mat-label>
            <mat-form-field appearance="outline" class="w-100">
                <mat-select formControlName="title">
                    <mat-option *ngFor="let opt of titleOptions" [value]="opt">{{ opt }}</mat-option>
                </mat-select>
                <mat-error>{{ setErrorMessage('title', 'Title') }}</mat-error>
            </mat-form-field>
        </div>
        <div class="col-lg-12"> 
            <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-16" for="firstName">
                First name
            </mat-label>
            <mat-form-field appearance="outline" class="w-100">
                <input matInput type="text" formControlName="firstName" />
                <mat-error>{{ setErrorMessage('firstName', 'First name') }}</mat-error>
            </mat-form-field>
            
            <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-16" for="lastName">
                Last name
            </mat-label>
            <mat-form-field appearance="outline" class="w-100">
                <input matInput type="text" formControlName="lastName" />
                <mat-error>{{ setErrorMessage('lastName', 'Last name') }}</mat-error>
            </mat-form-field>
        </div>
    </div>
</div>
