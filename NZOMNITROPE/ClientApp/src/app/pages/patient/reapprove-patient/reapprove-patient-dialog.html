<h2 mat-dialog-title>Thank you for submitting your patient's reapproval.</h2>
<mat-dialog-content>
    <div class="p-16 bg-light-info rounded m-y-20 text-info">
        <div class="icon-block">
            <svg-icon src="assets/images/svgs/information-mark-circle.svg" svgClass="icon-block-image"></svg-icon> 
            <div class="icon-block-content" style="max-width: 100%;">
                To finalise OEFV® access for your patient, send a signed prescription to ePharmacy, Reply Paid 612 Virgina QLD 4014. ePharmacy will liaise directly with the patient to dispense and deliver OFEV®. 
            </div>
        </div>
    </div>
    <mat-divider></mat-divider>
    <app-prescription [patientId]="data.patientId" (downloaded)="onPrescriptionDownloaded()"></app-prescription>
</mat-dialog-content>
