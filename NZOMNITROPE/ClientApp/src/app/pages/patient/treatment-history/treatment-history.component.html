<mat-list>
  <h3 matSubheader>Treatment history</h3>
  @if (treatmentHistory$ | async; as treatmentHistory) {
    @for (item of treatmentHistory; track item) {
      <mat-list-item>
        <p matListItemTitle class="f-w-800">{{ item.eventDate | date : "dd/MM/YYYY" }}</p>
        <p matListItemLine class="m-t-8">
          {{item.description }}
        </p>
      </mat-list-item>
    }
  }
</mat-list>
