<div class="summary-block">
    <div class="row">
        <div class="col-lg-12 m-b-16">
            <label>Patient:</label> {{patient.title}} {{ patient.firstName}} {{patient.lastName}}
        </div>
        <div class="col-lg-6 m-b-16">
            <label>Date of birth: </label> {{ patient.dateOfBirth | date : "dd/MM/YYYY" }}
        </div>
        <div class="col-lg-6 m-b-16">
            <label>Gender:</label> {{patient.gender}}
        </div>
    </div>
</div>
