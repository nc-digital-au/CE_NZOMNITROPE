<section class="grid-container">
  <!-- Welcome Section -->
  <div class="welcome-container">
    <h1 class="welcome-text">
      Welcome to the
      <br>
      <span class="omni-pal">
        <span class="omni red">Omni</span>
        <span class="pal blue">Pal</span>
      </span>
      <br>
      Patient Support Program
    </h1>
  </div>  

  <!-- Device and Training Section -->
  <div class="grid-item action-buttons">
    <button class="custom-button" (click)="onOrderDeviceClick()">
      Order SurePal<sup>®</sup> Device and Consumables
    </button>
    <button class="custom-button" (click)="onScheduleTrainingClick()">
      Schedule an Injection Training Session
    </button>
  </div>

<!-- Video Section -->
<div class="grid-item video-box">
  <h1>Watch: How to Inject Video</h1>
  <button class="primary-button" (click)="onWatchVideoClick()">
    <mat-icon>play_arrow</mat-icon>
  </button>
</div>

<!-- Resources Section -->
<div class="grid-item resources-box">
  <ul class="resource-list">
    <li class="resource-item"><a href="../../../assets/files/Omnitrope5.pdf" target="_blank">SurePal 5mg How to use guide</a></li>
    <li class="resource-item"><a href="../../../assets/files/Omnitrope10.pdf" target="_blank">SurePal 10mg How to use guide</a></li>
    <li class="resource-item"><a href="../../../assets/files/Omnitrope15.pdf" target="_blank">SurePal 15mg How to use guide</a></li>
    <li class="resource-item">
      <a [href]="CONTACT_VALUES.CMI_LINK" target="_blank" rel="noopener noreferrer">
          Consumer Medicine Information
      </a>
  </li>
    </ul>
</div>
</section>
