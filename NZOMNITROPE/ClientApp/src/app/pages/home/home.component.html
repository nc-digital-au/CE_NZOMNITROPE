<section class="grid-container">
  <!-- Welcome Section -->
  <div class="grid-item welcome-box">
    <h2>Welcome to OmniPal® Patient Support Program</h2>
  </div>

  <!-- Device and Training Section -->
  <div class="grid-item action-buttons">
    <button class="primary-button" (click)="onOrderDeviceClick()">
      Order SurePal® Device and Consumables
    </button>
    <button class="primary-button" (click)="onScheduleTrainingClick()">
      Schedule an Injection Training Session
    </button>
  </div>

  <!-- Video Section -->
  <div class="grid-item video-box">
    <h3>Watch: How to Inject Video</h3>
    <button class="primary-button">Play Video</button>
  </div>

  <!-- Resources Section -->
  <div class="grid-item resources-box">
    <h3>Resources</h3>
    <ul>
      <li>PDF Guide 1</li>
      <li>PDF Guide 2</li>
      <li>PDF Guide 3</li>
      <li>Consumer Medicine Information</li>
    </ul>
  </div>
</section>
