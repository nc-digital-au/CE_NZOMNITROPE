<div [formGroup]="form" class="m-b-10">
  <mat-radio-group [formControlName]="radioFormElement.name">
    @for (option of radioFormElement.options; track option.value) {
      <mat-radio-button [value]="option.value">{{ option.label }}</mat-radio-button>
    }
  </mat-radio-group>
  <mat-error class="f-s-12 p-x-16">
    @if (tempForm.submitted && !radioFormElement.hideErrors) {
      {{ setErrorMessage(form, radioFormElement.name, radioFormElement.errorLabel) }}
    }
  </mat-error>
</div>
