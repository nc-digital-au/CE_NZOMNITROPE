<div class="form-container">
    <mat-form-field appearance="outline" class="expand-form-field">
      <mat-label>Select a Time</mat-label>
      <mat-select [formControl]="timeControl">
        <mat-option *ngFor="let time of availableTimes" [value]="time.value">
          {{ time.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
