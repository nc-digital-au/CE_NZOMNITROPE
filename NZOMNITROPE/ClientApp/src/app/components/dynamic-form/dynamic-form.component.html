@if (formReady && formDefinition.children && formDefinition.children.length) {
  <form [formGroup]="form" #tempForm="ngForm">
    <div class="row">
      @for (formElement of formDefinition.children; track formElement) {
        <app-form-element 
          [formElement]="formElement" 
          [form]="form" 
          [tempForm]="tempForm">
        </app-form-element>
      }
    </div>
    <ng-content></ng-content>
  </form>
}
